<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>카드 매칭 게임</title>
    <!-- High Legibility Educational Sans Font -->
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20261008-5">
</head>
<body>

    <nav class="game-toolbar" aria-label="게임 도구">
    <div id="finish-btn" class="hidden" title="축하 파티 보기">🏆 축하 파티 보기</div>
    <div id="home-btn" title="메인 화면으로">🏠 처음으로</div>
    <div id="fullscreen-btn" title="전체화면 전환">📺 전체화면</div>
    <button id="settings-btn" type="button">⚙️ 설정</button>
    </nav>
    <dialog id="settings-dialog">
        <h2>소리·움직임 설정</h2>
        <label><input id="setting-bgm" type="checkbox"> 배경음</label>
        <label><input id="setting-effects" type="checkbox"> 효과음</label>
        <label class="volume-setting">소리 크기 <input id="setting-volume" type="range" min="0" max="100" step="5" aria-label="소리 크기"> <output id="volume-value" for="setting-volume"></output></label>
        <label><input id="setting-voice" type="checkbox"> 1인 읽어주기</label>
        <p id="voice-setting-note">읽어주기는 1인 플레이에서 사용해요. 2인 이상은 각자의 소리가 겹치지 않도록 읽어주지 않아요.</p>
        <label><input id="setting-motion" type="checkbox"> 움직임 줄이기</label>
        <div class="settings-actions">
            <button id="quiet-mode-btn" type="button">조용한 모드</button>
            <button id="settings-close-btn" type="button">닫기</button>
        </div>
    </dialog>
    <div id="app-container">
        
        <!-- Main Menu (Merged Setup) -->
        <div id="menu-screen" class="screen">
            <div class="menu-header">
                <h1>⚡ 카드 매칭 게임</h1>
            </div>

            <div class="form-container">
                <div class="form-group">
                    <label>🎮 게임 모드</label>
                    <div class="mode-btns">
                        <button class="mode-btn selected" data-mode="coop">🌟 칭찬·협동 모드 (추천)</button>
                        <button class="mode-btn" data-mode="battle">🚀 배틀·경쟁 모드</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>🎨 테마 선택</label>
                    <div id="theme-selection" class="selection-grid">
                        <!-- Theme buttons generated here -->
                    </div>
                </div>

                <div class="form-group">
                    <label>👥 인원</label>
                    <div class="count-btns">
                        <button class="count-btn" data-count="1">1인 플레이</button>
                        <button class="count-btn selected" data-count="2">2인 플레이</button>
                        <button class="count-btn" data-count="3">3인 플레이</button>
                        <button class="count-btn" data-count="4">4인 플레이</button>
                    </div>
                </div>
                <button id="start-btn" class="big-orange-btn">게임 시작하기</button>
            </div>
        </div>

        <!-- Gameplay Screen -->
        <div id="game-screen" class="screen hidden" data-players="2">
            <!-- Dynamically populated player areas -->
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="screen hidden">
            <h1 id="gameover-title">게임 종료!</h1>
            
            <div class="gameover-stats" id="gameover-stats-container">
                <!-- Dynamically populated gameover stats per player -->
            </div>
            
            <button id="restart-btn" class="big-orange-btn mt-4" style="margin-top: 40px; z-index: 100;">다른 게임 고르기</button>
        </div>
    </div>
    
    <script src="script.js?v=20261008-5"></script>
</body>
</html>
